name: Bump Version On Merge

# Runs on every push to main (merges included) so the version is bumped
# *before* the build workflows run. Those builds are chained off this
# workflow via `workflow_run`, so they always package the bumped version.
# The bump commit is pushed with GITHUB_TOKEN, which does not re-trigger
# workflows, so this cannot loop.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bump-version-main
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump versionName patch and versionCode
        run: |
          file="app/build.gradle.kts"

          version_name=$(grep -m1 'versionName = "' "$file" | sed -E 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          IFS='.' read -r major minor patch <<< "$version_name"
          new_patch=$((10#$patch + 1))
          new_version="$major.$minor.$new_patch"

          version_code=$(grep -m1 'versionCode = ' "$file" | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          new_version_code=$((version_code + 1))

          sed -i -E "0,/versionName = \"[0-9]+\.[0-9]+\.[0-9]+\"/s//versionName = \"$new_version\"/" "$file"
          sed -i -E "0,/versionCode = [0-9]+/s//versionCode = $new_version_code/" "$file"

          echo "NEW_VERSION=$new_version" >> "$GITHUB_ENV"

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: bump version to $NEW_VERSION"
          git push
