name: Build Debug APK

# Chained off "Bump Version On Merge" (which runs on pushes to main) so the
# published APK always carries the freshly bumped version.
on:
  workflow_run:
    workflows: ["Bump Version On Merge"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch:

# This workflow only ever builds main, so a fixed group keeps a single run
# active regardless of the ref reported by the triggering event.
concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: true

# This workflow builds a debug APK and publishes it as a release asset.
permissions:
  contents: write

jobs:
  build:
    name: Assemble github debug APK
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # Explicit ref: for workflow_run events the default checkout is the
      # pre-bump commit that triggered the bump workflow.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace

      - name: Locate debug APK
        id: apk
        run: |
          apk_path=$(find app/build/outputs/apk/github/debug -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$apk_path" ]; then
            echo "No APK found" >&2
            exit 1
          fi
          publish_path="app/build/outputs/apk/github/debug/ssheadunit-github-debug.apk"
          cp "$apk_path" "$publish_path"
          echo "path=$publish_path" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-github-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish debug APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-latest
          name: Latest Debug APK
          body: Automated latest github debug APK build.
          prerelease: true
          make_latest: false
          files: ${{ steps.apk.outputs.path }}
          overwrite_files: true
