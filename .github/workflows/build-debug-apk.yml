name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow builds a debug APK and publishes it as a release asset.
permissions:
  contents: write

jobs:
  build:
    name: Assemble github debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace

      - name: Locate debug APK
        id: apk
        run: |
          apk_path=$(find app/build/outputs/apk/github/debug -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$apk_path" ]; then
            echo "No APK found" >&2
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Publish debug APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-latest
          name: Latest Debug APK
          body: Automated latest github debug APK build.
          prerelease: true
          make_latest: false
          files: ${{ steps.apk.outputs.path }}
          overwrite_files: true
