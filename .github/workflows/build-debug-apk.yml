name: Build Debug APK

# Chained off "Bump Version On Merge" (which runs on pushes to main) so the
# published APK always carries the freshly bumped version.
on:
  workflow_run:
    workflows: ["Bump Version On Merge"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch:

# This workflow only ever builds main, so a fixed group keeps a single run
# active regardless of the ref reported by the triggering event.
concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: true

# This workflow builds a debug APK and publishes it as a release asset.
permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    name: Assemble github debug APK
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # Explicit ref: for workflow_run events the default checkout is the
      # pre-bump commit that triggered the bump workflow.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # Enough history for the PR lookup below to inspect the commits that
          # precede the version-bump commit.
          fetch-depth: 10

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace

      # `workflow_run.pull_requests` is only populated for runs triggered by
      # `pull_request` events; the bump workflow runs on `push`, so that field
      # is always empty here. Resolve the PR from the merged commit instead,
      # falling back to the commit subject (`... (#123)` / `Merge pull request
      # #123 ...`) when the API lookup returns nothing.
      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr_number=0
          if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "${HEAD_SHA:-}" ]; then
            candidates="$HEAD_SHA"
          else
            # Manual runs: the tip of main is usually the version-bump commit,
            # so also consider the commits it was created on top of.
            candidates="$(git rev-list -n 5 HEAD)"
          fi
          for sha in $candidates; do
            subject="$(git log -1 --format=%s "$sha" 2>/dev/null || true)"
            case "$subject" in
              "chore: bump version to "*) continue ;;
            esac
            number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" \
              --jq '[.[] | select(.number != null) | .number] | first // empty' 2>/dev/null || true)"
            case "$number" in ''|*[!0-9]*) number="" ;; esac
            if [ -z "$number" ]; then
              number="$(printf '%s' "$subject" | sed -nE 's/.*#([0-9]+).*/\1/p' | head -n 1)"
              case "$number" in ''|*[!0-9]*) number="" ;; esac
            fi
            if [ -n "$number" ]; then
              pr_number="$number"
              break
            fi
          done
          if [ "$pr_number" = "0" ]; then
            echo "Warning: no pull request associated with the built commit; using pr0." >&2
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Locate debug APK
        id: apk
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          apk_path=$(find app/build/outputs/apk/github/debug -maxdepth 1 -name "*.apk" | head -n 1)
          if [ -z "$apk_path" ]; then
            echo "No APK found" >&2
            exit 1
          fi
          apk_filename="$(basename "$apk_path" .apk)"
          parse_output="$(APK_FILENAME="$apk_filename" python - <<'PY'
          import os
          import re

          name = os.environ["APK_FILENAME"]
          match = re.match(r'^(.*?)[-_]([0-9]+(?:\.[0-9]+){0,3})(?:[-_].*)?$', name)
          if match:
              print(match.group(1))
              print(match.group(2))
          PY
          )"
          app_name="$(echo "$parse_output" | sed -n '1p')"
          version_name="$(echo "$parse_output" | sed -n '2p')"
          if [ -z "$version_name" ]; then
            version_name="unknown"
            echo "Warning: Unable to extract version from APK filename '$apk_filename'; using fallback." >&2
          fi
          if [ -z "$app_name" ]; then
            echo "Warning: Unable to extract app name from APK filename '$apk_filename'; using fallback." >&2
          fi
          app_name="${app_name:-app}"
          pr_number="${PR_NUMBER:-0}"
          publish_path="$(dirname "$apk_path")/${app_name}-v${version_name}-pr${pr_number}.apk"
          cp "$apk_path" "$publish_path"
          echo "path=$publish_path" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-github-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish debug APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-apk-latest
          name: Latest Debug APK
          body: Automated latest github debug APK build.
          prerelease: true
          make_latest: false
          files: ${{ steps.apk.outputs.path }}
          overwrite_files: true
